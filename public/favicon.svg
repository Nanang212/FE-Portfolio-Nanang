<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512' width='512' height='512'>
  <defs>
    <linearGradient id='bgGrad' x1='0%' y1='0%' x2='100%' y2='100%'>
      <stop offset='0%' stop-color='#09231b'/>
      <stop offset='50%' stop-color='#124434'/>
      <stop offset='100%' stop-color='#0a2c21'/>
    </linearGradient>
    <linearGradient id='accentGrad' x1='0%' y1='0%' x2='100%' y2='0%'>
      <stop offset='0%' stop-color='#34d399'/>
      <stop offset='100%' stop-color='#10b981'/>
    </linearGradient>
    <filter id='glow' x='-20%' y='-20%' width='140%' height='140%'>
      <feGaussianBlur stdDeviation='12' result='blur'/>
      <feComposite in='SourceGraphic' in2='blur' operator='over'/>
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x='16' y='16' width='480' height='480' rx='120' fill='url(#bgGrad)' stroke='#34d399' stroke-opacity='0.35' stroke-width='8'/>

  <!-- Subtle Developer Terminal Header Dots -->
  <circle cx='120' cy='105' r='12' fill='#ef4444' opacity='0.85'/>
  <circle cx='155' cy='105' r='12' fill='#f59e0b' opacity='0.85'/>
  <circle cx='190' cy='105' r='12' fill='#10b981' opacity='0.85'/>

  <!-- Terminal Divider Line -->
  <line x1='80' y1='145' x2='432' y2='145' stroke='#34d399' stroke-opacity='0.25' stroke-width='3' stroke-dasharray='6 6'/>

  <!-- Code Symbol '>_' -->
  <path d='M 100 230 L 160 280 L 100 330' fill='none' stroke='url(#accentGrad)' stroke-width='26' stroke-linecap='round' stroke-linejoin='round'/>

  <!-- Main Monogram 'NA' (Nanang Aditya) -->
  <text x='200' y='320' font-family='system-ui, -apple-system, sans-serif' font-weight='900' font-size='150' fill='#ffffff' letter-spacing='-4'>NA</text>

  <!-- Terminal Blinking Cursor Block -->
  <rect x='415' y='235' width='22' height='85' rx='6' fill='#34d399' filter='url(#glow)'/>
</svg>